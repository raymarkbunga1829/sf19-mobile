<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0e1512" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SF19" />
  <title>Stockfish 19 · Mobile</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">♞</span>
        <div>
          <h1>Stockfish 19</h1>
          <p id="engineStatus">Loading engine…</p>
        </div>
      </div>
      <button id="btnMenu" class="icon-btn" aria-label="Settings">☰</button>
    </header>
    <main>
      <section class="eval-row">
        <div id="evalBar" class="eval-bar"><div id="evalFill"></div></div>
        <div class="eval-meta"><strong id="evalText">0.00</strong><span id="depthText">d0</span></div>
      </section>
      <section class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Chessboard"></div>
        <div id="promoModal" class="promo hidden">
          <p>Promote to</p>
          <div class="promo-row">
            <button data-promo="q">Queen</button>
            <button data-promo="r">Rook</button>
            <button data-promo="b">Bishop</button>
            <button data-promo="n">Knight</button>
          </div>
        </div>
      </section>
      <section class="status-row"><p id="turnText">White to move</p><p id="bestText"></p></section>
      <section class="moves-box" id="movesBox"></section>
      <nav class="controls">
        <button id="btnNew">New</button>
        <button id="btnUndo">Undo</button>
        <button id="btnFlip">Flip</button>
        <button id="btnHint">Hint</button>
        <button id="btnPlay" class="primary">Engine move</button>
      </nav>
    </main>
    <aside id="drawer" class="drawer hidden">
      <div class="drawer-inner">
        <header><h2>Settings</h2><button id="btnClose" class="icon-btn">✕</button></header>
        <label>Mode<select id="modeSelect"><option value="play">Play vs Stockfish</option><option value="analyze">Analysis board</option></select></label>
        <label>You play<select id="colorSelect"><option value="w">White</option><option value="b">Black</option></select></label>
        <label>Strength<select id="levelSelect"><option value="800">Beginner 800</option><option value="1100">Casual 1100</option><option value="1400" selected>Club 1400</option><option value="1700">Strong club 1700</option><option value="2000">Expert 2000</option><option value="2300">Master 2300</option><option value="full">Full Stockfish 19</option></select></label>
        <label>Think time<select id="timeSelect"><option value="300">0.3s</option><option value="800" selected>0.8s</option><option value="1500">1.5s</option><option value="3000">3s</option><option value="depth12">Depth 12</option><option value="depth16">Depth 16</option></select></label>
        <p class="hint">Safari → Share → Add to Home Screen. Engine: Stockfish 19 lite WASM. GPL-3.0</p>
      </div>
    </aside>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
